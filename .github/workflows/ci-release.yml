name: CI & Release Pipeline

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: cachix/install-nix-action@v31

      - name: Lint and Format verification
        run: nix flake check

      - name: Build Flake packages
        run: nix build

      - name: Run Tests
        run: go test ./...

  release:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Sync Git Environment
        run: |
          git fetch --tags --force
          git pull origin master --ff-only

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: cachix/install-nix-action@v31

      - name: Semantic Release with Nix Auto-Formatting
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Run semantic-release up to the "prepare" phase (writes CHANGELOG.md)
          # We omit @semantic-release/git here to intercept and format it first
          npx \
            -p semantic-release \
            -p @semantic-release/changelog \
            -p @semantic-release/github \
            -p @semantic-release/commit-analyzer \
            -p @semantic-release/release-notes-generator \
            semantic-release --plugins \
              "@semantic-release/commit-analyzer" \
              "@semantic-release/release-notes-generator" \
              "@semantic-release/changelog"

          # 2. Check if a new version step updated the CHANGELOG.md file
          if [ -f CHANGELOG.md ] && ! git diff --exit-code CHANGELOG.md > /dev/null; then
            echo "New release generated. Running Nix formatting fixes..."
            
            # Format the autogenerated changelog using your flake's defined formatter engine
            nix fmt CHANGELOG.md || true
            
            # 3. Manually stage, commit, and push the cleanly formatted changelog asset
            npx -p @semantic-release/git -p semantic-release semantic-release --plugins \
              '["@semantic-release/git", {"assets": ["CHANGELOG.md"], "message": "chore(release): ${nextRelease.version} [skip ci]"}]'
          fi

          # 4. Finalize and publish release assets/tags back to GitHub releases interface
          npx -p @semantic-release/github -p semantic-release semantic-release --plugins \
            "@semantic-release/github"
