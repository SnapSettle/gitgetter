name: CI & Release Pipeline

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: cachix/install-nix-action@v31

      - name: Lint and Format verification
        run: nix flake check

      - name: Build Flake packages
        run: nix build

      - name: Run Tests
        run: go test ./...

  release:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Sync Git Environment
        run: |
          # Prune any local tags that don't exist on remote
          git fetch --prune --prune-tags origin

          # Force sync all valid remote tags
          git fetch --tags --force origin master

          # Force pull to make sure history matches origin perfectly
          git pull origin master --ff-only

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: cachix/install-nix-action@v31

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx \
            -p semantic-release \
            -p @semantic-release/changelog \
            -p @semantic-release/git \
            -p @semantic-release/github \
            -p @semantic-release/commit-analyzer \
            -p @semantic-release/release-notes-generator \
            semantic-release
