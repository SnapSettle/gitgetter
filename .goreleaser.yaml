version: 2

project_name: gitgetter

before:
  hooks:
    - go mod tidy
    - nix flake check

builds:
  - id: gitgetter
    binary: gitgetter
    main: .
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{ .Version }}_
      {{ .Os }}_
      {{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
